name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      - name: Unzip Source Code
        run: unzip -q BranaBrowser-Android.zip
        
      - name: Cari Lokasi Folder Proyek
        id: find_project
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          echo "Proyek ditemukan di: $PROJECT_DIR"
          echo "DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
      - name: Build dan Tampilkan Error
        run: |
          cd $DIR
          # Cek apakah file gradlew ada
          if [ -f "gradlew" ]; then 
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else 
            gradle clean assembleDebug --stacktrace
          fi
