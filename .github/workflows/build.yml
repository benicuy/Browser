name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip Source Code
        run: |
          if [ -f "BranaBrowser-Android.zip" ]; then
            unzip -q -o BranaBrowser-Android.zip
          else
            echo "File BranaBrowser-Android.zip tidak ditemukan!"
            exit 1
          fi

      - name: Cari Lokasi Folder Proyek
        run: |
          # Prioritaskan settings.gradle / settings.gradle.kts sebagai root project, abaikan folder __MACOSX
          SETTINGS_FILE=$(find . -not -path '*/.*' \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find . -not -path '*/.*' \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          fi
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Folder proyek Gradle tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project ditemukan di: $PROJECT_DIR"
          echo "DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Debug APK & Simpan Log
        id: build_apk
        continue-on-error: true
        run: |
          cd "$DIR"
          set -o pipefail
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build_log.txt
          else
            gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt
          fi

      - name: Upload Log Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-ERROR-BRANA
          path: ${{ env.DIR }}/build_log.txt
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BranaBrowser-APK
          path: ${{ env.DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
