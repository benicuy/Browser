name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      - name: Unzip Source Code
        run: unzip -q BranaBrowser-Android.zip
        
      - name: Cari Lokasi Folder Proyek
        id: find_project
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          echo "Proyek ditemukan di: $PROJECT_DIR"
          echo "DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
      - name: Perbaiki Versi Kotlin (Jika Perlu)
        run: |
          cd $DIR
          # Menaikkan versi Kotlin ke 1.9.22 agar kompatibel dengan Java 17 & Gradle 8.7
          # Jika proyek menggunakan versi lebih baru, ini tidak akan merusak apapun.
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/g' build.gradle || true
          
      - name: Build dengan Gradle (Tampilkan Error Spesifik)
        run: |
          cd $DIR
          if [ -f "gradlew" ]; then chmod +x gradlew; GRADLE_CMD="./gradlew"; else GRADLE_CMD="gradle"; fi
          
          # Tambahkan --info agar pesan error 'e:' muncul
          $GRADLE_CMD clean assembleDebug --stacktrace --info
          
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BranaBrowser-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
