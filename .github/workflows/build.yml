name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      - name: Unzip Source Code
        run: unzip -q BranaBrowser-Android.zip
        
      - name: Cari Lokasi Folder Proyek
        id: find_project
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          echo "DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
      - name: Build dengan Gradle (Jangan Gagalkan Workflow)
        continue-on-error: true
        run: |
          cd $DIR
          if [ -f "gradlew" ]; then chmod +x gradlew; ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi
          
      - name: SIMPAN LOG ERROR KE FILE TXT
        if: always()
        run: |
          cd $DIR
          # Menyimpan log build ke file untuk didownload
          if [ -f "gradlew" ]; then ./gradlew assembleDebug --stacktrace > build_log.txt 2>&1; else gradle assembleDebug --stacktrace > build_log.txt 2>&1; fi
          
      - name: UPLOAD LOG ERROR (Biar bisa dibaca)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-ERROR-BRANA
          path: ${{ env.DIR }}/build_log.txt
          
      - name: UPLOAD APK (Jika kebetulan ada)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BranaBrowser-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
