name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      - name: Unzip Source Code
        run: unzip -q BranaBrowser-Android.zip
        
      - name: Cek Struktur Folder (Opsional)
        run: ls -la Brana/
        
      - name: Build with Gradle
        run: cd Brana && gradle clean assembleDebug --stacktrace
        
      - uses: actions/upload-artifact@v4
        with:
          name: BranaBrowser-APK
          path: Brana/app/build/outputs/apk/debug/app-debug.apk
